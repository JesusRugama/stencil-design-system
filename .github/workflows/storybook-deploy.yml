name: Build and Deploy Storybook website
on:
  push:
    branches:
      - main
    paths:
      - "packages/stencil-design-system/**"
      - ".github/workflows/storybook-deploy.yml"
env:
  AWS_REGION: us-east-1
  S3_BUCKET: stencil-design-system-storybook
  CLOUDFRONT_DISTRIBUTION_ID: EQD4LYJHNW9FV

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stencil-design-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464624688884:role/jesusrugama-sites-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/stencil-design-system/package-lock.json

      - name: Install dependencies
        run: npm ci
      
      - name: Build stencil components
        run: npm run build

      - name: Build storybook
        run: npm run build-storybook
      
      - name: Sync to S3 bucket
        run: |
          aws s3 sync storybook-static/ s3://${{ env.S3_BUCKET }}/ --delete
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
