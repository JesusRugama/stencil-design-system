name: Build and Deploy Storybook website
on:
  push:
    branches:
      - main
    paths:
      - "packages/stencil-design-system/**"

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stencil-design-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/stencil-design-system/package-lock.json

      - name: Install dependencies
        run: npm ci
      
      - name: Build stencil components
        run: npm run build

      - name: Build storybook
        run: npm run build-storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Sync to S3 bucket
        run: |
          aws s3 sync storybook-static/ s3://stencil-design-system-storybook/ --delete
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
